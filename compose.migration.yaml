name: migration

# Container chạy một lần rồi thoát; không khởi động cùng backend.
#   docker compose --env-file .env.backend -f compose.migration.yaml run --rm migration migrate
#   docker compose --env-file .env.backend -f compose.migration.yaml run --rm migration seed
services:
  migration:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: migration:latest
    container_name: migration
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the env file}
