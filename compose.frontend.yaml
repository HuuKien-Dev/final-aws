name: vuon-xa-frontend

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vuon-xa-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env.frontend}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

