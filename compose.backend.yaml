name: vuon-xa-backend

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: vuon-xa-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.backend}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env.backend}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ASSET_STORAGE: ${ASSET_STORAGE:-local}
      S3_ASSET_BUCKET: ${S3_ASSET_BUCKET:-}
      S3_IMAGE_PREFIX: ${S3_IMAGE_PREFIX:-media}
      S3_AUDIO_PREFIX: ${S3_AUDIO_PREFIX:-audio}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AI_AUDIO_ENABLED: ${AI_AUDIO_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

